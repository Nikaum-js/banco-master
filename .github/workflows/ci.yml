name: CI

# Gate do que já está fechado (motor M1 + UI M2 + rede M3). O ativo mais valioso do repo é o
# motor puro e determinístico; este workflow é o que impede uma regressão nele de passar batido.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Um push novo no mesmo ref cancela o anterior — a fila não acumula runs obsoletos.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: lint · types · testes · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # `--frozen-lockfile`: o CI instala exatamente o que está no `bun.lock`. Se o lockfile
      # estiver dessincronizado do package.json, é aqui que se descobre — não em produção.
      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # `tsc -b` do build já checa tipos, mas rodar antes dá o erro de tipo sem esperar o bundle.
      #
      # Cobre os TRÊS projetos (app, node, test) via as `references` do `tsconfig.json`. Antes
      # era só `-p tsconfig.app.json` e o passo dava confiança falsa: `tests/`, `e2e/` e
      # `scripts/` não estavam em nenhum tsconfig, então fixture com campo inventado passava
      # verde. Ao adicionar pasta nova, ela precisa entrar no `include` de algum dos três.
      - name: Tipos
        run: bun run typecheck

      - name: Testes
        run: bunx vitest run

      - name: Build
        run: bun run build

  simulation:
    name: simulação seedada
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      # Lote CURTO e seedado (036): 30 partidas em 2/3/6 jogadores sob o teto padrão de rodadas.
      # Roda em job separado do gate principal porque é o passo mais lento e não bloqueia
      # o feedback de lint/tipos. Seed fixa: uma falha aqui é reproduzível localmente com
      # `bun run sim:batch -- --games=10 --counts=2,3,6`. `--report=` desliga a escrita em
      # `reports/` (ignorado pelo git, sem valor num runner efêmero).
      - name: Lote de simulação
        run: bun run sim:batch -- --games=10 --counts=2,3,6 --report=

      # Lotes LONGOS (100 partidas × 2/3/6). Moram aqui, e não no `vitest run` do gate
      # principal, porque são CPU-bound e sequenciais: no job generalista disputavam os 2
      # vCPUs com ~100 outros arquivos e o de 6 jogadores estourou o timeout (run
      # 30233981454). Sozinhos no runner, cabem com folga.
      # `SIM_GAMES=30` em vez do lote completo de 100 por conta: o lote inteiro levava ~17min de
      # relógio (limitado pelo de 6 jogadores) e atrasava o feedback de todo push. 30 partidas por
      # contagem = 90 partidas, ~4min, e mantém o invariante rodando sobre partidas COMPLETAS, que
      # é onde ele acha o que teste unitário não acha (deadlock de dívida fora da vez, cobrança
      # muda, falso positivo de truncagem — todos os três achados por este job).
      #
      # O que se perde é a CAUDA de seeds: o falso positivo mais recente estava na seed 76 de 100,
      # então um lote de 30 o encontraria num push seguinte, não no primeiro. Antes de release,
      # rodar o lote inteiro com `bun run test:sim` (default 100).
      - name: Lotes headless (amostra)
        run: SIM_GAMES=30 bun run test:sim

  e2e:
    name: smoke E2E (2/3/6 jogadores)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      # `--with-deps` traz as bibliotecas de sistema que o chromium precisa no runner limpo.
      - name: Instalar chromium do Playwright
        run: bunx playwright install --with-deps chromium

      # Só o smoke single-player (036): sobe o app pelo `webServer` do config e dirige a
      # partida pela UI real. O `multiplayer.spec.ts` (038) fica FORA — depende de credencial
      # Supabase e de rede, então não serve como gate de PR de fora do repo.
      - name: Smoke E2E
        run: bunx playwright test e2e/2players.spec.ts e2e/3players.spec.ts e2e/6players.spec.ts

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  a11y:
    name: acessibilidade (axe, sobre o build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Instalar chromium do Playwright
        run: bunx playwright install --with-deps chromium

      # `e2e/a11y.spec.ts` só casa com o projeto `built` (playwright.config.ts, FR-051): sobe
      # `vite build && vite preview` sozinho e audita cada parada do caminho de jogo com
      # `@axe-core/playwright`. Falha em violação `serious`/`critical` (D-039); o resto vai
      # só pro log do passo, sem quebrar o job.
      - name: Acessibilidade e avatares visuais
        run: bunx playwright test e2e/a11y.spec.ts e2e/avatarSkins.spec.ts

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-a11y
          path: test-results/
          retention-days: 7

  full-match:
    name: partida completa (semeada, sobre o build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Instalar chromium do Playwright
        run: bunx playwright install --with-deps chromium

      # `e2e/fullMatch.spec.ts` (projeto `built`, FR-050/FR-051): conduz uma partida SEMEADA
      # (?scenario=endgame, D10 do plan) pela interface real até a última falência e confere
      # a classificação na tela. O roteiro anuncia no próprio log que a partida é semeada —
      # o `sim:batch` (job `simulation`) é quem prova partidas inteiras jogadas do zero.
      - name: Partida completa (fim de jogo)
        run: bunx playwright test e2e/fullMatch.spec.ts

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-full-match
          path: test-results/
          retention-days: 7
