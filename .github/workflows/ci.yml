name: CI

# Gate do que já está fechado (motor M1 + UI M2 + rede M3). O ativo mais valioso do repo é o
# motor puro e determinístico; este workflow é o que impede uma regressão nele de passar batido.
on:
  push:
    branches: [main]
  pull_request:
  # 03h BRT: paga a cauda completa de seeds fora do feedback de cada commit.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      full_simulation:
        description: Rodar 100 partidas por contagem em vez da amostra de 30
        required: false
        default: false
        type: boolean

concurrency:
  # Um push novo no mesmo ref cancela o anterior — a fila não acumula runs obsoletos.
  # Schedule/manual usam grupos próprios para nunca cancelar a validação de um push.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detectar escopo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      quality: ${{ steps.scope.outputs.quality }}
      database: ${{ steps.scope.outputs.database }}
      simulation: ${{ steps.scope.outputs.simulation }}
      browser: ${{ steps.scope.outputs.browser }}
      full_simulation: ${{ steps.scope.outputs.full_simulation }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Jobs caros só rodam quando um arquivo do seu caminho de execução mudou. O schedule
      # liga apenas a simulação completa; workflow_dispatch liga a verificação integral.
      - name: Classificar arquivos alterados
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REQUEST_FULL_SIMULATION: ${{ inputs.full_simulation || false }}
        run: |
          set -euo pipefail

          quality=false
          database=false
          simulation=false
          browser=false
          full_simulation=false

          enable_all() {
            quality=true
            database=true
            simulation=true
            browser=true
          }

          if [[ "$EVENT_NAME" == "schedule" ]]; then
            simulation=true
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            enable_all
          else
            base_sha="$BEFORE_SHA"
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              base_sha="$PR_BASE_SHA"
            fi

            # Primeiro push de uma branch/repositório não tem base comparável. Segurança:
            # nesse caso roda tudo, em vez de economizar omitindo um gate necessário.
            if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]] || ! git cat-file -e "$base_sha^{commit}"; then
              enable_all
            else
              while IFS= read -r changed_file; do
                [[ -z "$changed_file" ]] && continue
                echo "changed: $changed_file"

                case "$changed_file" in
                  .github/workflows/*|package.json|bun.lock|.bun-version|eslint.config.*|tsconfig*.json|vite.config.*|vitest.config.*|playwright.config.*|vercel.json)
                    enable_all
                    ;;
                esac

                case "$changed_file" in
                  tests/db/*)
                    ;;
                  # `*.html` e não `index.html`: a 051 transformou o site num MPA com cinco
                  # entrypoints, e a lista ficou presa no primeiro. Mudança em `play.html`
                  # — a entrada do app — passava sem lint, tipos, testes nem build.
                  src/*|tests/*|e2e/*|scripts/*|public/*|*.html)
                    quality=true
                    ;;
                esac

                case "$changed_file" in
                  supabase/*|tests/db/*)
                    database=true
                    ;;
                esac

                case "$changed_file" in
                  src/game/ui/*)
                    ;;
                  src/game/*|src/lib/*|src/net/recorder.ts|tests/sim/*|scripts/sim-*)
                    simulation=true
                    ;;
                esac

                case "$changed_file" in
                  # Idem: o gate Lighthouse mede `/play`, servido por `play.html`. Com
                  # `index.html` na lista, editar a própria página medida não acionava a medição.
                  src/*|e2e/*|public/*|*.html|vite.config.*|playwright.config.*)
                    browser=true
                    ;;
                esac
              done < <(git diff --name-only "$base_sha" "$HEAD_SHA")
            fi
          fi

          if [[ "$EVENT_NAME" == "schedule" || "$REQUEST_FULL_SIMULATION" == "true" ]]; then
            full_simulation=true
          fi

          {
            echo "quality=$quality"
            echo "database=$database"
            echo "simulation=$simulation"
            echo "browser=$browser"
            echo "full_simulation=$full_simulation"
          } >> "$GITHUB_OUTPUT"

  gates:
    name: lint · types · testes · build
    needs: changes
    if: needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # `--frozen-lockfile`: o CI instala exatamente o que está no `bun.lock`. Se o lockfile
      # estiver dessincronizado do package.json, é aqui que se descobre — não em produção.
      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # `tsc -b` do build já checa tipos, mas rodar antes dá o erro de tipo sem esperar o bundle.
      #
      # Cobre os TRÊS projetos (app, node, test) via as `references` do `tsconfig.json`. Antes
      # era só `-p tsconfig.app.json` e o passo dava confiança falsa: `tests/`, `e2e/` e
      # `scripts/` não estavam em nenhum tsconfig, então fixture com campo inventado passava
      # verde. Ao adicionar pasta nova, ela precisa entrar no `include` de algum dos três.
      - name: Tipos
        run: bun run typecheck

      - name: Testes
        run: bunx vitest run

      - name: Build
        run: bun run build

      - name: Orçamento do bundle inicial
        run: bun run audit:bundle

  database:
    name: contrato do banco (RPCs sobre Postgres real)
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # `supabase start` sobe o stack local (Postgres + auth + realtime) e aplica as
      # migrations. O stack inteiro, e não um `postgres:17` pelado, porque a 0003 escreve
      # políticas sobre `realtime.messages` — o motivo longo está em `supabase/config.toml`.
      - name: Subir o Supabase local
        run: supabase start

      # Do zero e em ordem, sem estado herdado do `start`: é a única forma de provar que a
      # sequência 0001→0006 aplica limpa num banco novo.
      - name: Reaplicar as migrations do zero
        run: supabase db reset

      # Executa as funções, não só as cria: `create function` não valida o corpo de uma
      # função plpgsql, então um job que apenas aplicasse as migrations passaria verde com
      # `reopen_room` quebrada. O cabeçalho de `tests/db/rpc.sql` conta a história inteira.
      - name: Contrato das RPCs
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f tests/db/rpc.sql

  simulation:
    name: simulação seedada (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.simulation == 'true'
    runs-on: ubuntu-latest
    # 20, não 50: o teto acompanha a FATIA, não o lote inteiro. O lote completo de 6
    # jogadores media ~20min num runner só (é de onde vinham os 50); dividido em três, a
    # fatia mais cara fecha em ~7min. Continua sendo guarda contra trava, não meta.
    timeout-minutes: 20
    strategy:
      # Uma fatia vermelha não cancela as outras: lote seedado que falha é relatório de bug,
      # e saber QUAIS seeds quebraram vale mais que economizar os minutos das fatias sadias.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      # Os lotes headless moram aqui, e não no `vitest run` do gate principal, porque são
      # CPU-bound e sequenciais: no job generalista disputavam os vCPUs com ~100 outros
      # arquivos e o de 6 jogadores estourou o timeout (run 30233981454).
      #
      # Duas alavancas independentes, e vale não confundi-las:
      #
      # `SIM_GAMES` encolhe a COBERTURA. 30 por contagem em vez de 100 mantém o invariante
      # rodando sobre partidas COMPLETAS — onde ele acha o que teste unitário não acha
      # (deadlock de dívida fora da vez, cobrança muda, falso positivo de truncagem, os três
      # achados aqui) —, mas perde a CAUDA de seeds: o falso positivo mais recente estava na
      # seed 76 de 100. O schedule noturno e workflow_dispatch(full_simulation=true) pagam a
      # cauda inteira.
      #
      # `SIM_SHARD` NÃO encolhe nada — só reparte as mesmas seeds entre runners. O lote roda
      # dentro de um `it()` síncrono por contagem, então o vitest só paraleliza por arquivo e
      # o de 6 jogadores segurava o relógio sozinho (231s dos 244s do job) enquanto 2p e 3p
      # já tinham terminado. Em três fatias, o caminho crítico vira um terço dele.
      - name: Lotes headless
        env:
          SIM_SHARD: ${{ matrix.shard }}/3
          SIM_GAMES: ${{ needs.changes.outputs.full_simulation == 'true' && '100' || '30' }}
        run: bun run test:sim

  e2e:
    name: smoke E2E (2/3/6 jogadores)
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # As duas alavancas que todo job de browser daqui liga, e o porquê está em
    # `playwright.config.ts`, uma vez:
    #
    # `PW_WORKERS` — o default 1 existe por causa de `multiplayer.spec.ts`, que é limitada
    #   por latência e morre de fome em paralelo. Nenhum job da CI a roda (precisa de
    #   credencial e de infra real), então serializar aqui só deixava vCPU parado.
    # `PW_SERVERS` — o `webServer` é global no Playwright, então toda invocação subia dev E
    #   preview. Este job só usa o dev server; declarar isso poupa um `vite build` inteiro.
    env:
      PW_WORKERS: 2
      PW_SERVERS: dev
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      # `--with-deps` traz as bibliotecas de sistema que o chromium precisa no runner limpo.
      - name: Instalar chromium do Playwright
        run: bunx playwright install --with-deps chromium

      # Só o smoke single-player (036): sobe o app pelo `webServer` do config e dirige a
      # partida pela UI real. O `multiplayer.spec.ts` (038) fica FORA — depende de credencial
      # Supabase e de rede, então não serve como gate de PR de fora do repo.
      #
      # `deckOdds` (057) e `fuligem` (055) entram aqui porque NÃO estavam em job nenhum, e
      # isso cobrou o preço previsto: as duas apodreceram em silêncio. A fuligem afirmava os
      # nomes de casa anteriores ao encurtamento de `2231bc1`; a deckOdds procurava o
      # `aria-label` com travessão, que `7a90710` trocou por dois-pontos. Nenhum gate rodava,
      # então nenhum dos dois renames apareceu vermelho. Custam 17s somadas.
      #
      # A fuligem tem uma segunda metade que fala com o Supabase real; ela se auto-pula sem
      # credencial (`test.skip`), então o gate roda os 4 testes locais e ignora os 3 de infra.
      # `errorBoundary` e `inviteRetention` continuam fora de propósito: são opt-in por infra.
      - name: Smoke E2E
        run: bunx playwright test e2e/2players.spec.ts e2e/3players.spec.ts e2e/6players.spec.ts e2e/deckOdds.spec.ts e2e/fuligem.spec.ts

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  responsivo:
    name: responsivo (celular, tablet e desktop, sobre o build)
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Ver o job `e2e` para o porquê das duas. Aqui é `built`: só o preview é usado, e subir
    # o dev server junto seria um segundo servidor que nenhum teste abre.
    env:
      PW_WORKERS: 2
      PW_SERVERS: built
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Instalar chromium do Playwright
        run: bunx playwright install --with-deps chromium

      - name: Build para auditoria
        run: bun run build

      # Três rodadas sobre `vite preview`; a mediana evita reprovar por uma única oscilação
      # do runner e bloqueia regressões de score, FCP, LCP, TBT e CLS.
      - name: Gate Lighthouse
        run: bun run audit:performance

      # `e2e/responsive.spec.ts` roda no projeto `built` (playwright.config.ts) por dois
      # motivos: é o bundle que se promove, e a rota 404 de verdade só existe no preview.
      # Cobre retrato de 320 a 768, paisagem de 667 a 1024 (com 740×360, o mínimo oficial),
      # desktop como regressão, Atlas e Fuligem, e o contrato do OrientationGate — girar o
      # aparelho não pode desmontar a partida.
      # `pregao.spec.ts` (D-078) entra neste job e não no `a11y`: o que ele mede é
      # geometria em viewport (transbordo, alvo de toque, ação alcançável em 667×375 e
      # 740×360), com a auditoria do axe como último passo do próprio arquivo.
      - name: Gate responsivo
        run: bunx playwright test e2e/responsive.spec.ts e2e/pregao.spec.ts

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-responsivo
          path: test-results/
          retention-days: 7

  a11y:
    name: acessibilidade (axe, sobre o build)
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Ver o job `e2e`. Só o preview.
    env:
      PW_WORKERS: 2
      PW_SERVERS: built
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Instalar chromium do Playwright
        run: bunx playwright install --with-deps chromium

      # `e2e/a11y.spec.ts` só casa com o projeto `built` (playwright.config.ts, FR-051): sobe
      # `vite build && vite preview` sozinho e audita cada parada do caminho de jogo com
      # `@axe-core/playwright`. Falha em violação `serious`/`critical` (D-039); o resto vai
      # só pro log do passo, sem quebrar o job.
      - name: Acessibilidade e avatares visuais
        run: bunx playwright test e2e/a11y.spec.ts e2e/avatarSkins.spec.ts

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-a11y
          path: test-results/
          retention-days: 7

  full-match:
    name: partida completa e animação real
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Ver o job `e2e`. Aqui NÃO cabe recortar `PW_SERVERS`: este é o único job que mistura
    # os dois projetos — `fullMatch.spec.ts` é `built` (preview, 4173) e
    # `diceAnimation.spec.ts` é `chromium` (dev, 5173), porque mede a coreografia real e não
    # tem por que esperar um bundle. Declarar um escopo só derrubaria metade do job.
    env:
      PW_WORKERS: 2
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Instalar chromium do Playwright
        run: bunx playwright install --with-deps chromium

      # `e2e/fullMatch.spec.ts` (projeto `built`, FR-050/FR-051): conduz uma partida SEMEADA
      # (?scenario=endgame, D10 do plan) pela interface real até a última falência e confere
      # a classificação na tela. O roteiro anuncia no próprio log que a partida é semeada —
      # os lotes headless (job `simulation`) provam partidas inteiras jogadas do zero.
      - name: Partida completa e animação real
        run: bunx playwright test e2e/fullMatch.spec.ts e2e/diceAnimation.spec.ts

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-full-match
          path: test-results/
          retention-days: 7
