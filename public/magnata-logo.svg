<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 256 256"
  role="img"
  aria-labelledby="magnata-logo-title magnata-logo-description"
>
  <title id="magnata-logo-title">Magnata Imobiliário</title>
  <desc id="magnata-logo-description">
    Um tabuleiro de propriedades em perspectiva sustenta uma metrópole cuja silhueta forma a letra M.
  </desc>

  <!-- Base do tabuleiro: o filete inferior mantém a leitura de peça mesmo em 32 px. -->
  <path fill="#031f3f" d="m31 174 97 39 97-39v14l-97 44-97-44Z" />

  <!-- Casas em perspectiva. -->
  <g stroke="#f7f3e9" stroke-width="4" stroke-linejoin="miter">
    <path fill="#05294f" d="m30 171 31-12 34 16-33 18Z" />
    <path fill="#d8a63c" d="m62 193 33-18 33 15-34 19Z" />
    <path fill="#e2af40" d="m94 209 34-19 34 18-34 19Z" />
    <path fill="#d8a63c" d="m128 190 33-15 34 18-33 15Z" />
    <path fill="#05294f" d="m161 175 34-16 31 12-31 22Z" />
  </g>

  <!-- Volumes dourados ao fundo sugerem patrimônio sem recorrer a moedas ou cifrões. -->
  <g fill="#c99732">
    <path d="m73 82 24-16v62l-24 14Z" />
    <path d="m145 57 21 14v46l-21-15Z" />
    <path d="m190 111 20 11v41l-20 11Z" />
  </g>

  <!-- Skyline e tabuleiro se encontram num M contínuo. -->
  <path
    fill="#031f3f"
    d="M57 175v-72l17-11v26l22-13 15 13V52l17-11v88l17-14V82l21 14v33l13-12v-15l18-11v84l-17 8v-53l-48 40-49-40v53Z"
  />

  <!-- Contraponto inferior: fecha a letra sem transformar o símbolo numa casa genérica. -->
  <path
    fill="#05294f"
    stroke="#f7f3e9"
    stroke-width="4"
    stroke-linejoin="miter"
    d="m110 166 18 16 18-16v39l-18 10-18-10Z"
  />
</svg>
